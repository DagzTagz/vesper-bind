[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vesper-bind"
version = "0.1.0"
description = "Unofficial DagzTagz CLI that binds local artifacts into one receipt. Does not call a model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "DagzTagz contributors" },
]
keywords = ["dagztagz", "receipt", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
vesper-bind = "vesper_bind.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vesper_bind"]

[tool.hatch.build.targets.wheel.sources]
"src/vesper_bind" = "vesper_bind"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/SECURITY.md",
  "/CHANGELOG.md",
  "/AGENTS.md",
  "/getting-started.md",
  "/.gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
